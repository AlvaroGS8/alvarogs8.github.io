<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Álvaro | Game Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #0d0d12;
            color: #f2f2f2;

            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .terminal {
            color: #777;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 80px);
            letter-spacing: -3px;
            margin-bottom: 10px;
        }

        h1 span {
            color: #7c5cff;
        }

        .subtitle {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .progress {
            width: 280px;
            height: 6px;
            background: #22222c;
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto 18px;
        }

        .progress-bar {
            width: 65%;
            height: 100%;
            background: #7c5cff;
            border-radius: 10px;
            animation: loading 2s infinite alternate ease-in-out;
        }

        .status {
            color: #777;
            font-family: monospace;
            font-size: 13px;
        }

        .footer {
            margin-top: 60px;
            color: #555;
            font-size: 13px;
        }

        @keyframes loading {
            from {
                width: 45%;
            }

            to {
                width: 75%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="terminal">
            &gt; loading_portfolio.exe
        </div>

        <h1>
            Álvaro<span>.</span>
        </h1>

        <p class="subtitle">
            Game Developer & Programmer
        </p>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <p class="status">
            Portfolio under construction...
        </p>

        <p class="footer">
            C++ · C# · Unreal Engine · Unity
        </p>

    </main>

</body>
</html>
